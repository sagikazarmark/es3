version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      cargo-bergshamra:
        patterns:
          - "bergshamra*"
      cargo:
        patterns:
          - "*"
        exclude-patterns:
          - "bergshamra*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
    exclude-paths:
      - .github/workflows/release.yml
      - .github/workflows/dagger.yaml
